schema_version: 1
name: redis
version: "7.2.17"
description: Redis server and CLI built in a private user prefix
homepage: https://redis.io/
source:
  url: https://download.redis.io/releases/redis-7.2.17.tar.gz
  sha256: 07c679c013fd82513299733bddf91999bbbc830351ec9ea985a533b09a595d76
  subdir: redis-7.2.17
requires_tools: [make, cc]
build:
  - [make, "-j${jobs}", MALLOC=libc, REDIS_CFLAGS=, REDIS_LDFLAGS=]
install:
  - [make, install, "PREFIX=${prefix}", MALLOC=libc, REDIS_CFLAGS=, REDIS_LDFLAGS=]
check:
  - ["${prefix}/bin/redis-server", --version]
  - ["${prefix}/bin/redis-cli", --version]
environment:
  prepend:
    PATH: ["${prefix}/bin"]
