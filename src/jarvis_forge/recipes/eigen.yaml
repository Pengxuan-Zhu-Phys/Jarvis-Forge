schema_version: 1
name: eigen
version: "3.4.0"
description: Eigen C++ template library for linear algebra
homepage: https://eigen.tuxfamily.org/
source:
  url: https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
  sha256: 8586084f71f9bde545ee7fa6d00288b264a2b7ac3607b974e54d13e7162c1c72
  subdir: eigen-3.4.0
requires_tools: [cmake, cc, c++]
build:
  - [cmake, -S, "${source}", -B, "${build}", "-DCMAKE_INSTALL_PREFIX=${prefix}", -DBUILD_TESTING=OFF, -DEIGEN_BUILD_DOC=OFF, -DCMAKE_POLICY_VERSION_MINIMUM=3.5]
install:
  - [cmake, --install, "${build}"]
check:
  - ["${python}", -c, "from pathlib import Path; import sys; p=Path(sys.argv[1]); assert (p/'include/eigen3/Eigen/Core').is_file(); assert (p/'share/eigen3/cmake/Eigen3Config.cmake').is_file()", "${prefix}"]
environment:
  set:
    Eigen3_ROOT: "${prefix}"
    EIGEN3_INCLUDE_DIR: "${prefix}/include/eigen3"
  prepend:
    CMAKE_PREFIX_PATH: ["${prefix}"]
