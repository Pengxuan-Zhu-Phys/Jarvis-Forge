# HiggsTools 1.1.3 for GMFit.
# The archive is the vendored GMFit source pin. Upstream git tag v1.1.3 does not
# include external/vendor, so CMake must not fetch third-party code.
# scripts/higgstools_prepare.py applies assignment-trace v2, then the HS
# measurement-breakdown bridge v1, before configuration.
# scripts/higgstools_install.py installs the Python package into the active
# interpreter. scripts/higgstools_datasets.py installs HBDataSet v1.7 and
# HSDataSet v1.1 and points the interpreter at those directories.
name: higgstools-build
platforms: [linux]
build:
  name: HiggsTools
  version: 1.1.3
  environment: share/HiggsTools/datasets.sh
  source:
    url: https://github.com/Pengxuan-Zhu-Phys/Jarvis-Forge/releases/download/sources/HiggsTools-1.1.3-vendored.tar.gz
    sha256: 6a7c928080c0ba5c9b93fc062c8b894412027a86d0447d255d25438a51fabf12
    subdir: higgstools
  cmake:
    # _Higgs is the Python module. HiggsTools is the C++ library install target.
    targets: [_Higgs, HiggsTools]
    options:
      CMAKE_CXX_STANDARD: 17
      HiggsTools_BUILD_PYTHON_MODULE: true
      HiggsTools_BUILD_EXAMPLES: false
      HiggsTools_BUILD_TESTING: false
      HiggsTools_USE_BUNDLED_DEPS: true
      FETCHCONTENT_FULLY_DISCONNECTED: true
      Python_EXECUTABLE: {type: FILEPATH, value: "${python}"}
      Python3_EXECUTABLE: {type: FILEPATH, value: "${python}"}
checks:
  before:
    python:
      version: ">=3.10"
      development: true
      modules: [setuptools, wheel, pip]
    tools:
      cmake: ">=3.17"
      c++: ">=9"
      make: ">=3"
      patch: ">=2"
    scripts:
      - path: scripts/higgstools_prepare.py
        args: ["${sources.HiggsTools}"]
  after:
    scripts:
      - path: scripts/higgstools_install.py
        args: ["${sources.HiggsTools}", "${work}/build/HiggsTools.install", "${work}/higgstools-wheel"]
      - path: scripts/higgstools_datasets.py
        args: ["${work}/install/HiggsTools.install"]
