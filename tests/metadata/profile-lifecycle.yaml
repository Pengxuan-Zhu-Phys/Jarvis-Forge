- id: forge.profile-lifecycle.profile-remove-closes-inner-locks-before-deleting-them
  title: Profile remove closes inner locks before deleting them
  purpose: Profile remove closes inner locks before deleting them.
  binding:
    adapter: pytest
    selector: tests/test_profile_lifecycle.py::test_profile_remove_closes_inner_locks_before_deleting_them
  scenario:
    inputs:
      environment: Disposable local prefixes, fake native tools or offline installer
        wheels.
    action: Exercise profile remove closes inner locks before deleting them.
  criteria:
  - id: behavior
    expected: Profile remove closes inner locks before deleting them.
    verification: automated
  failure_meaning: Profile lifecycle, installer separation or shell ownership regressed.
  limitations:
  - Does not certify an actual GCC/CPython build on an HPC node.
  review:
    status: draft
