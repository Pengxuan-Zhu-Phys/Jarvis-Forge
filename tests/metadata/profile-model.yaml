    selector: tests/test_paths.py::test_software_names_preserve_name_and_version_without_length_limit
  scenario:
    inputs:
      environment: Disposable local Forge homes; fake native backends or local tiny
        CMake sources.
    action: Exercise software names preserve name and version without length limit.
  criteria:
  - id: contract
    expected: Software names preserve name and version without length limit.
    verification: automated
  failure_meaning: The profile, prefix, transaction or exported identity boundary
    regressed.
  limitations:
