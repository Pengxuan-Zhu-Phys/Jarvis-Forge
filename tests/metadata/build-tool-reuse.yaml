- id: forge.build-tools.native-role-change
  title: Resolve a reused tool as a new native root
  purpose: Install only the new native tool while preserving consumers and fixed CMake
    bindings.
  binding:
    adapter: pytest
    selector: tests/test_profile_transactions.py::test_historical_tool_becomes_a_native_root_without_rebuilding_consumers
  scenario:
    inputs:
      environment: Local isolated dependency graph and engine fixtures
    action: Install a build-only consumer, optionally add fixed CMake as an explicit
      root, add an unrelated package and promote the borrowed tool through apt or
      a build recipe dependency step.
  criteria:
  - id: contract
    expected: The consumer and fixed CMake keep their hashes and prefixes; only the
      new native tool is installed, optional source evidence persists without CMake,
      and no fallback solve is repeated.
    verification: automated
  failure_meaning: A historical build tool crosses a dependency-use boundary, changes
    an installed root or loses its validation evidence.
  limitations:
  - Local development test; the Linux host installation is verified separately by
    the maintainer.
  review:
    status: draft
- id: forge.build-tools.forced-resolution
