- id: forge.build-tools.executable-symlink-retargeting-invalidates-source-identity
  title: Executable symlink identity
  purpose: A tool symlink cannot silently retarget to another executable.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_executable_symlink_retargeting_invalidates_source_identity
  scenario:
    inputs:
      environment: Disposable executable symlinks and a fake source store.
    action: Retarget an executable symlink while preserving file contents.
  criteria:
  - id: identity
    expected: Reuse evidence becomes invalid when the executable target changes.
    verification: automated
  failure_meaning: Build-tool reuse crosses a runtime/identity boundary or changes
    exact replay and cache guarantees.
  limitations: *id001
  review: *id002
- id: forge.build-tools.incremental-root-preservation
  title: Preserve installed roots during incremental installation
  purpose: Keep explicit constraints when adding a package and stop solver drift before a write.
  binding:
    adapter: pytest
    selector: tests/test_profile_transactions.py::test_additive_install_preserves_constraints_and_refuses_changed_roots
  scenario:
    inputs: {environment: Temporary native store with a deterministic solver fixture}
    action: Add an unrelated root while requesting the installed application by name.
  criteria:
  - id: roots
    expected: Changed root hashes are refused before installation. A stable plan installs only the new package.
    verification: automated
  failure_meaning: Adding a package can silently replace installed applications or their dependencies.
  limitations: [Local transaction fixture]
  review: {status: draft}
- id: forge.build-tools.rollback-after-planning-cache-invalidation
  title: Protect installed files after replanning
  purpose: Verify rollback uses the original store inventory even when the planning cache expires.
  binding:
    adapter: pytest
    selector: tests/test_profile_transactions.py::test_rollback_keeps_installed_packages_after_plan_cache_invalidation
  scenario:
    inputs: {environment: Temporary native store with an installed app and library}
    action: Invalidate the plan cache and fail a subsequent installation.
  criteria:
  - id: rollback
    expected: Existing payloads and database records survive and the new prefix is absent.
    verification: automated
  failure_meaning: A failed incremental install can remove previously installed files.
  limitations: [Local transaction fixture]
  review: {status: draft}
- id: forge.build-tools.partial-reuse
  title: Preserve compatible build tools after a candidate fails
  purpose: Isolate optional solver and patch-order failures across multiple tools.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_incompatible_candidate_keeps_other_tools
  scenario:
    inputs: {environment: Three tools and a committed lock in a local solver fixture}
    action: Reject a candidate during solving or validation, remove an unused candidate, or recover from a stale historical reference.
  criteria:
  - id: compatible-tools
    expected: The plan and evidence retain the compatible tools. A required stale reference or unverified external prefix is never accepted.
    verification: automated
  failure_meaning: One incompatible tool causes unrelated rebuilds or incorrect reuse evidence.
  limitations: [Simulated solver]
  review: {status: draft}
- id: forge.build-tools.external-patches
  title: Derive patch variants from the recipe
  purpose: Keep ordered source patches intact while formatting an external constraint.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_external_spec_lets_spack_derive_ordered_patches
  scenario:
    inputs: {environment: Local patched spec fixture}
    action: Format a candidate with a patch and another variant.
  criteria:
  - id: patch-identity
    expected: The external constraint retains the ordinary variant and the source retains its original patches.
    verification: automated
  failure_meaning: External solving can lose patch metadata or mutate the installed spec.
  limitations: [Spec-format fixture]
  review: {status: draft}
- id: forge.build-tools.lock-history
  title: Discover historical tools in the full lock
  purpose: The lock remains authoritative, retained evidence carries consumer hashes,
    and evidence omissions do not remove exclusions.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_history_is_derived_from_the_lock_after_evidence_is_empty
  scenario:
    inputs:
      environment: Local isolated dependency graph and engine fixtures
    action: Reconstruct old external build edges after an intervening transaction
      selects no tools.
  criteria:
  - id: contract
    expected: The lock remains authoritative, retained evidence carries consumer hashes,
      and evidence omissions do not remove exclusions.
    verification: automated
  failure_meaning: A historical build tool crosses a dependency-use boundary, changes
    an installed root or loses its validation evidence.
  limitations:
  - Local development test; the Linux host installation is verified separately by
    the maintainer.
  review:
    status: draft
