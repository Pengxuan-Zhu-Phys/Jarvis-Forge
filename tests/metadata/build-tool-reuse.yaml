- id: forge.build-tools.real-concrete-input-reuse
  title: Verify concrete-input filtering with real Spack
  purpose: Keep fixed suite bindings and historical optional tools separate in the
    real Spack solver.
  binding:
    adapter: pytest
    selector: tests/test_spack_integration.py::test_real_incremental_build_tool_reuse
  scenario:
    inputs:
      environment: Local isolated dependency graph and engine fixtures
    action: Solve fixture packages and a fixed CMake root with Spack 1.2.2, preserve
      their locks, promote a historical tool to a new root or link dependency and
      re-offer it to a fresh build-only consumer.
  criteria:
  - id: contract
    expected: Filtering resolves new native uses while preserving historical consumer
      hashes and edges. Revalidated external reuse remains available and fixed CMake
      retains its bound prefix and hash.
    verification: automated
  failure_meaning: A historical build tool crosses a dependency-use boundary, changes
    an installed root or loses its validation evidence.
  limitations:
  - Local development test; the Linux host installation is verified separately by
    the maintainer.
  - Opt in with JFORGE_SPACK_INTEGRATION=1 and local JFORGE_SPACK_ENGINE, JFORGE_SPACK_BUILTIN_REPO
    and JFORGE_SPACK_SOLVER_PATH; prebuilt clingo only, bootstrap disabled.
  review:
    status: draft
- id: forge.build-tools.fixed-suite-boundary
  title: Distinguish fixed tool-suite bindings
  purpose: Treat a changed fixed CMake identity as a profile binding error.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_fixed_tool_suite_roots_are_not_optional_historical_loans
  scenario:
    inputs:
      environment: Local profile metadata and temporary filesystem
    action: Preserve a valid fixed CMake root, then change its locked prefix and start
      an incremental transaction.
  criteria:
  - id: identity
    expected: Suite names are never classified as optional loans; a changed prefix
      raises a profile binding error before solving and recommends checking or recreating
      the profile.
    verification: automated
  failure_meaning: Fixed tools are confused with optional loans, or a changed prefix
    escapes validation.
  limitations:
  - Local filesystem and metadata fixture.
  review:
    status: draft
- id: forge.build-tools.retargeted-tool-prefix
  title: Track retargeted historical prefixes
  purpose: An external whose lexical tool-store prefix became an escaping symlink
    still requires historical source validation.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_retargeted_tool_prefix_remains_a_historical_reference
  scenario:
    inputs:
      environment: Local profile metadata and temporary filesystem
    action: Track retargeted historical prefixes
  criteria:
  - id: identity
    expected: An external whose lexical tool-store prefix became an escaping symlink
