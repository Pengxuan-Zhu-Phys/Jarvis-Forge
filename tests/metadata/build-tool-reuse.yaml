- id: forge.build-tools.suite-name-consistency
  title: Use one suite definition at all reuse boundaries
  purpose: Solver externals, history, Planner fixed names and inventory use the same
    suite names. Trial buildable:false candidates remain optional; inventories without
    suite metadata retain their previous classification.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_suite_names_are_shared_by_history_planner_and_inventory
  scenario:
    inputs:
      environment: Temporary profile, native transaction fixture and full concrete
        lock
    action: Use one suite definition at all reuse boundaries
  criteria:
  - id: binding
    expected: Solver externals, history, Planner fixed names and inventory use the
      same suite names. Trial buildable:false candidates remain optional; inventories
      without suite metadata retain their previous classification.
    verification: automated
  failure_meaning: Suite identity drift is confused with optional reuse, or an invalid
    fixed binding reaches the solver.
  limitations:
  - Local development fixtures; Linux host installation remains a separate maintainer
    check.
  review:
    status: draft
- id: forge.build-tools.locked-suite-binding
  title: Reject locked fixed-tool identity drift before solving
  purpose: A GCC or CMake build-only node with a different version or prefix raises
    a profile binding error before any solver invocation and preserves the committed
