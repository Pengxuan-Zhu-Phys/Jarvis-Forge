schema_version: 1
kind: test-metadata
project_id: jarvis-forge
scope:
  component: native-build-tool-reuse
definitions:
- id: forge.build-tools.tool-eligibility-uses-the-complete-dependency-graph
  title: Complete graph tool eligibility
  purpose: Exclude roots, link/run closures, incoming link edges and compiler providers.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_tool_eligibility_uses_the_complete_dependency_graph
  scenario:
    inputs:
      environment: Disposable stores, fake native engine boundaries and local executable
        fixtures.
    action: Inspect the dependency graph, validate source tools, and plan or reject
      reuse.
  criteria:
  - id: contract
    expected: Exclude roots, link/run closures, incoming link edges and compiler providers.
    verification: automated
  failure_meaning: Build-tool reuse crosses a runtime/identity boundary or changes
    exact replay and cache guarantees.
  limitations:
  - Does not certify a real compiler bootstrap or ROOT build on HPC.
  review:
    status: draft
