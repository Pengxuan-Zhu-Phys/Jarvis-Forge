- id: forge.build-tools.executable-symlink-retargeting-invalidates-source-identity
  title: Executable symlink identity
  purpose: A tool symlink cannot silently retarget to another executable.
  binding:
    adapter: pytest
    selector: tests/test_build_tool_reuse.py::test_executable_symlink_retargeting_invalidates_source_identity
  scenario:
    inputs:
      environment: Disposable executable symlinks and a fake source store.
    action: Retarget an executable symlink while preserving file contents.
  criteria:
  - id: identity
    expected: Reuse evidence becomes invalid when the executable target changes.
    verification: automated
  failure_meaning: Build-tool reuse crosses a runtime/identity boundary or changes
    exact replay and cache guarantees.
  limitations: *id001
  review: *id002
