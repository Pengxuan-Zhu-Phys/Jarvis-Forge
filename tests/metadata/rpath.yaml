schema_version: 1
kind: test-metadata
project_id: jarvis-forge
scope:
  component: cmake-runtime-paths
definitions:
- id: forge.cmake.cmake-rpath-merging-preserves-typed-values
  title: Typed RPATH merge
  purpose: Merge list and scalar cache entries without Python repr, preserve escapes/expressions
    and keep merging idempotent.
  binding:
    adapter: pytest
    selector: tests/test_toolchains.py::test_cmake_rpath_merging_preserves_typed_values
  scenario:
    inputs:
      environment: Disposable local cache entries; the real link test needs local
        CMake and a C compiler.
    action: Merge compiler runtime paths and inspect generated arguments or build
      a tiny local program.
  criteria:
  - id: rpath
    expected: Merge list and scalar cache entries without Python repr, preserve escapes/expressions
      and keep merging idempotent.
    verification: automated
  failure_meaning: RPATH merging corrupts typed values, linker arguments or same-directory
    reconfiguration.
  limitations:
  - Does not certify a complete ROOT build on HPC.
  review:
    status: draft
