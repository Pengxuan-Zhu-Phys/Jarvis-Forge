- id: forge.native.cmake-automatic-budget
  title: Record the automatic budget in real local CMake builds
  purpose: Verify the real CMake argv and persisted result against small and larger
    CPU allocations.
  binding:
    adapter: pytest
    selector: tests/test_project_builds.py::test_real_cmake_build_records_automatic_cpu_budget
  scenario:
    inputs:
      source: tiny locally compiled C++ producer
      available_cpus:
      - 4
      - 48
    action: Build and install with the existing host CMake and C++ compiler.
  criteria:
  - id: budget
    expected: The real --parallel argument is min(available CPU, 16), and result.json
      records the same policy.
    verification: automated
  failure_meaning: The native package or shell boundary does not follow the documented
    runtime policy.
  limitations:
  - A tiny local C++ build, not a real ROOT or HPC compiler build.
  review: *id001
- id: forge.native.verification-guard-escapes-native-cache-miss-catches
  title: Verification guard escapes native cache miss catches
  purpose: Invalid or absent required signatures escape native cache-miss catches,
    even when the operation log cannot be written.
  binding:
    adapter: pytest
    selector: tests/test_spack_planning.py::test_verification_guard_escapes_native_cache_miss_catches
  scenario:
    inputs:
      backend: pinned Spack cache-error semantics, no external host
    action: Exercise native catch boundaries and controller verification evidence.
  criteria:
  - id: trust
    expected: Invalid or absent required signatures escape native cache-miss catches,
      even when the operation log cannot be written.
    verification: automated
  failure_meaning: A trust failure could be mistaken for a cache miss or a successful
    installation.
  limitations:
  - Uses isolated native API stand-ins; actual package installations remain target-host
    acceptance.
  review:
    status: draft
