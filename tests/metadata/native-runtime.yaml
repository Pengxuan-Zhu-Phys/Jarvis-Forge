- id: forge.native.cpu-budget-respects-affinity-and-ancestor-cgroup-quota
  title: Cpu budget respects affinity and ancestor cgroup quota
  purpose: Cgroup v1 and v2 ancestry and process affinity jointly constrain the CPU
    budget; malformed quotas do not create zero jobs.
  binding:
    adapter: pytest
    selector: tests/test_parallelism.py::test_cpu_budget_respects_affinity_and_ancestor_cgroup_quota
  scenario:
    inputs:
      environment: temporary local files and isolated fake native backend responses
    action: Execute the boundary scenario and check its persisted state and visible
      result.
  criteria:
  - id: contract
    expected: Cgroup v1 and v2 ancestry and process affinity jointly constrain the
      CPU budget; malformed quotas do not create zero jobs.
    verification: automated
  failure_meaning: The native package or shell boundary does not follow the documented
    runtime policy.
  limitations:
  - Does not certify a real HPC compiler installation.
  review: &id001
    status: draft
