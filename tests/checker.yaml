schema_version: 2
kind: checker
id: forge-development
project: ..
profiles:
  daily: &id001
  - build-engine
  - checker-engine
  - apt-backend
  - environments
  - acceptance-history
  - release-recipes
  - cli
  - toolchains
  - bench
  - playlist
  - root-recipe
  acceptance: *id001
  release:
  - build-engine
  - checker-engine
  - apt-backend
  - environments
  - acceptance-history
  - release-recipes
  - cli
  - toolchains
  - bench
  - playlist
  - root-recipe
  - wheel-smoke
default_profile: daily
coverage:
  paths:
  - tests/test_*.py
  exclude:
  - path: tests/test_spack_integration.py
    reason: Needs a real Spack store. Run it with --group spack-integration.
groups:
- id: build-engine
  match:
  - tests/test_project_builds.py
  - tests/test_build_sources.py
  - tests/test_standard_checks.py
  - tests/test_build_cards.py
  inputs:
  - src/jarvis_forge/apt_cli.py
  - src/jarvis_forge/apt_progress.py
  - src/jarvis_forge/presentation.py
  - src/jarvis_forge/toolchains.py
  - src/jarvis_forge/cmake.py
  - src/jarvis_forge/build*.py
  - src/jarvis_forge/schemas/build.schema.json
  - src/jarvis_forge/downloads.py
  - tests/test_project_builds.py
  - tests/test_build_sources.py
  - pyproject.toml
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - src/jarvis_forge/card/*.yaml
  - src/jarvis_forge/standard_checks.py
  - builds/scripts/*.py
  - tools/build_project_assets.py
  - builds/release.json
  - src/jarvis_forge/__init__.py
  - tests/test_standard_checks.py
  - tests/test_build_cards.py
  - src/jarvis_forge/parallelism.py
  - src/jarvis_forge/shell_handoff.py
  skip_allow: []
- id: checker-engine
  match:
  - tests/test_checker.py
  - tests/test_catalog.py
  - tests/test_test_run.py
  - tests/test_test_reports.py
  inputs:
  - src/jarvis_forge/checker*.py
  - src/jarvis_forge/testing*.py
  - src/jarvis_forge/test_*.py
  - src/jarvis_forge/schemas/test-*.json
  - tests/test_test_reports.py
  - src/jarvis_forge/cli.py
  - src/jarvis_forge/presentation.py
  - src/jarvis_forge/cmake.py
  - src/jarvis_forge/builds.py
  - tests/test_checker.py
  - tests/test_catalog.py
  - tests/test_test_run.py
  - pyproject.toml
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - src/jarvis_forge/card/*.yaml
  - src/jarvis_forge/standard_checks.py
  skip_allow: []
- id: apt-backend
  match:
  - tests/test_build_tool_reuse.py
  - tests/test_spack_backend.py
  - tests/test_paths.py
  - tests/test_spack_layout.py
  - tests/test_apt.py
  - tests/test_apt_progress.py
  - tests/test_profiles.py
  - tests/test_package_operations.py
  - tests/test_package_terminal.py
  - tests/test_homebrew_backend.py
  - tests/test_spack_planning.py
  - tests/test_parallelism.py
  inputs:
  - src/jarvis_forge/build_tool_reuse.py
  - src/jarvis_forge/toolchains.py
  - tests/test_build_tool_reuse.py
  - src/jarvis_forge/unified_profiles.py
  - src/jarvis_forge/presentation.py
  - src/jarvis_forge/build_apps.py
  - src/jarvis_forge/scope_locks.py
  - src/jarvis_forge/spack*.py
  - src/jarvis_forge/bootstrap_patch.py
  - src/jarvis_forge/profile_fonts.py
  - src/jarvis_forge/apt*.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/recipe_releases.py
  - src/jarvis_forge/build_catalog.py
  - src/jarvis_forge/__init__.py
  - src/jarvis_forge/downloads.py
  - tests/test_spack*.py
  - tests/test_apt.py
  - tests/test_profiles.py
  - tests/test_package*.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  - tests/test_apt_progress.py
  - tests/test_homebrew_backend.py
  - src/jarvis_forge/homebrew_backend.py
  - src/jarvis_forge/build_catalog.py
  - src/jarvis_forge/parallelism.py
  - tests/test_parallelism.py
  - tests/test_spack_planning.py
  skip_allow: []
- id: spack-integration
  match:
  - tests/test_spack_integration.py
  cache: false
  env:
    JFORGE_SPACK_INTEGRATION: '1'
  inputs:
  - tests/test_spack_integration.py
  - tests/spack_reuse_probe.py
  - tests/fixtures/spack_repo/forge_test/**
  - src/jarvis_forge/build_tool_reuse.py
  - src/jarvis_forge/toolchains.py
  - src/jarvis_forge/spack*.py
- id: environments
  match:
  - tests/test_environment.py
  - tests/test_env_registry.py
  - tests/test_env_entries.py
  - tests/test_shell_repair.py
  - tests/test_pyenv_setup.py
  - tests/test_shell_handoff.py
  inputs:
  - src/jarvis_forge/environment*.py
  - src/jarvis_forge/shell_activation.py
  - src/jarvis_forge/shell_repair.py
  - tests/test_env*.py
  - tests/test_shell_repair.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  - src/jarvis_forge/env_entries.py
  - src/jarvis_forge/env_cli.py
  - src/jarvis_forge/managed_envs.py
  - tools/jforge-pyenv-setup.sh
  - tests/test_pyenv_setup.py
  - src/jarvis_forge/shell_handoff.py
  - tests/test_shell_handoff.py
  - src/jarvis_forge/apt_cli.py
  - src/jarvis_forge/build_cli.py
  - src/jarvis_forge/cli.py
  skip_allow: []
- id: acceptance-history
  match:
  - tests/test_workflow.py
  inputs:
  - src/jarvis_forge/runner.py
  - src/jarvis_forge/suite.py
  - src/jarvis_forge/comparison.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/schemas/suite.schema.json
  - tests/test_workflow.py
  - src/jarvis_forge/package_operations.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  skip_allow: []
- id: release-recipes
  match:
  - tests/test_recipe_releases.py
  - tests/test_recipe_publisher.py
  inputs:
  - jfrecipes
  - recipes/release.json
  - recipes/spack_repo/**
  - builds/release.json
  - builds/*.yaml
  - builds/library/*.yaml
  - builds/scripts/*.py
  - src/jarvis_forge/recipe_releases.py
  - src/jarvis_forge/build_catalog.py
  - src/jarvis_forge/__init__.py
  - tools/build*assets.py
  - tests/test_recipe_releases.py
  - tests/test_recipe_publisher.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  skip_allow: []
- id: cli
  match:
  - tests/test_cli.py
  - tests/test_presentation.py
  inputs:
  - src/jarvis_forge/*cli.py
  - src/jarvis_forge/presentation.py
  - src/jarvis_forge/__init__.py
  - tests/test_cli.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  - tests/test_presentation.py
  skip_allow: []
- id: playlist
  match:
  - tests/test_playlist*.py
  inputs:
  - src/jarvis_forge/playlist*.py
  - src/jarvis_forge/dashboard_cli.py
  - src/jarvis_forge/dashboard/**/*.py
  - src/jarvis_forge/dashboard/static/*
  - src/jarvis_forge/cli.py
  - src/jarvis_forge/presentation.py
  - src/jarvis_forge/testing.py
  - src/jarvis_forge/checker.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - tests/test_playlist*.py
  - tests/checker.yaml
  - pyproject.toml
  skip_allow: []
- id: bench
  match:
  - tests/test_bench.py
  - tests/test_bench_baseline.py
  - tests/test_bench_land.py
  - tests/test_bench_project.py
  - tests/test_cbs_bench.py
  inputs:
  - src/jarvis_forge/bench*.py
  - src/jarvis_forge/bench_projects/**
  - tests/test_cbs_bench.py
  - src/jarvis_forge/executor*.py
  - src/jarvis_forge/schemas/*.json
  - tests/test_bench*.py
  - tests/checker.yaml
  - pyproject.toml
  skip_allow: []
- id: toolchains
  match:
  - tests/test_toolchains.py
  - tests/test_unified_profiles.py
  - tests/test_profile_model.py
  - tests/test_profile_transactions.py
  - tests/test_profile_lifecycle.py
  - tests/test_package_lifecycle.py
  - tests/test_socket_runtime.py
  - tests/test_profile_exports.py
  - tests/test_build_apps.py
  inputs:
  - src/jarvis_forge/profile_cli.py
  - src/jarvis_forge/apt_cli.py
  - src/jarvis_forge/apt_progress.py
  - src/jarvis_forge/presentation.py
  - src/jarvis_forge/cmake.py
  - src/jarvis_forge/toolchain*.py
  - src/jarvis_forge/unified_profiles.py
  - src/jarvis_forge/card/apt_profiles.json
  - src/jarvis_forge/env_entries.py
  - src/jarvis_forge/build_cli.py
  - src/jarvis_forge/build_workspace.py
  - src/jarvis_forge/apt_profiles.py
  - src/jarvis_forge/builds.py
  - src/jarvis_forge/spack_backend.py
  - tests/test_toolchains.py
  - tests/test_unified_profiles.py
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  - tests/test_paths.py
  - tests/test_profile_model.py
  - tests/test_profile_transactions.py
  - tests/test_profile_lifecycle.py
  - src/jarvis_forge/scope_locks.py
  - src/jarvis_forge/scope_cleanup.py
  - tests/test_package_lifecycle.py
  - tests/test_socket_runtime.py
  - tests/test_profile_exports.py
  - tests/test_build_apps.py
  - tests/profile_fixtures.py
  - tests/conftest.py
  - src/jarvis_forge/profile*.py
  - src/jarvis_forge/build_apps.py
  - src/jarvis_forge/package_lifecycle.py
  - src/jarvis_forge/socket_runtime.py
  - src/jarvis_forge/apt_cli.py
  - src/jarvis_forge/homebrew_backend.py
  - src/jarvis_forge/spack_bridge.py
  - src/jarvis_forge/spack_entry.py
  skip_allow: []
checks:
- id: wheel-smoke
  check:
    package:
      distribution: Jarvis-Forge
      modules:
      - jarvis_forge
      commands:
      - - jforge
        - --version
- id: root-recipe
  inputs:
  - builds/root.yaml
  - src/jarvis_forge/builds.py
  - src/jarvis_forge/schemas/build.schema.json
  - src/jarvis_forge/paths.py
  - src/jarvis_forge/storage.py
  - src/jarvis_forge/package_operations.py
  - src/jarvis_forge/suite.py
  - tests/checker.yaml
  - pyproject.toml
  - src/jarvis_forge/card/*.yaml
  - builds/library/*.yaml
  - src/jarvis_forge/standard_checks.py
  - builds/scripts/*.py
  - tools/build_project_assets.py
  argv:
  - ${python}
  - -m
  - jarvis_forge
  - build
  - show
  - builds/root.yaml
  - --expanded
