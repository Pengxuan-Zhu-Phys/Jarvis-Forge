[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Jarvis-Forge"
dynamic = ["version"]
description = "User-space environments and reproducible command acceptance runs for scientific software"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jarvis-Forge Developers"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["typer>=0.16", "click>=8.1", "rich>=13", "PyYAML>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=6"]

[project.scripts]
jforge = "jarvis_forge.cli:main"

[project.urls]
Repository = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-Forge"
Issues = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-Forge/issues"
Documentation = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-Books/tree/main/Docs/Jarvis-Forge"

[tool.setuptools.dynamic]
version = {attr = "jarvis_forge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_forge = ["schemas/*.json", "examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

